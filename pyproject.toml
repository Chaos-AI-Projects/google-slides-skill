[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-slides-skill"
version = "0.1.0"
description = "Programmatic Google Slides presentation builder using the native Slides API"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = []

[project.optional-dependencies]
formulas = ["matplotlib>=3.8"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["google_slides_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
